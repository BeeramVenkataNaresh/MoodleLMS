name: nexus-eps-lms

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MOODLE_DB_NAME}
      MARIADB_USER: ${MOODLE_DB_USER}
      MARIADB_PASSWORD: ${MOODLE_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
    command:
      - mariadbd
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_allowed_packet=64M
      - --innodb-file-per-table=1
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping --protocol=tcp -h 127.0.0.1 -u root -p\"$$MARIADB_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - nexus

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - nexus

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8025/livez"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - nexus

  moodle-init:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexus-eps-moodle:4.5-php8.3
    restart: "no"
    command: ["/usr/local/bin/nexus-moodle-install"]
    environment: &moodle_environment
      MOODLE_URL: ${MOODLE_URL}
      MOODLE_SITE_FULLNAME: ${MOODLE_SITE_FULLNAME}
      MOODLE_SITE_SHORTNAME: ${MOODLE_SITE_SHORTNAME}
      MOODLE_PORTAL_NAME: ${MOODLE_PORTAL_NAME}
      MOODLE_PRODUCTION_URL: ${MOODLE_PRODUCTION_URL}
      MOODLE_PUBLIC_WEBSITE: ${MOODLE_PUBLIC_WEBSITE}
      MOODLE_ADMIN_USER: ${MOODLE_ADMIN_USER}
      MOODLE_ADMIN_EMAIL: ${MOODLE_ADMIN_EMAIL}
      MOODLE_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD}
      MOODLE_DB_NAME: ${MOODLE_DB_NAME}
      MOODLE_DB_USER: ${MOODLE_DB_USER}
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MOODLE_SMTP_HOST: ${MOODLE_SMTP_HOST}
      MOODLE_SMTP_PORT: ${MOODLE_SMTP_PORT}
    volumes:
      - moodle_app:/var/www/moodle
      - moodledata:/var/www/moodledata
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    networks:
      - nexus

  moodle:
    image: nexus-eps-moodle:4.5-php8.3
    restart: unless-stopped
    ports:
      - "8080:80"
    environment: *moodle_environment
    volumes:
      - moodle_app:/var/www/moodle
      - moodledata:/var/www/moodledata
    depends_on:
      moodle-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/login/index.php > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s
    networks:
      - nexus

  moodle-cron:
    image: nexus-eps-moodle:4.5-php8.3
    restart: unless-stopped
    command: ["/usr/local/bin/nexus-moodle-cron"]
    environment: *moodle_environment
    volumes:
      - moodle_app:/var/www/moodle
      - moodledata:/var/www/moodledata
    depends_on:
      moodle-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/moodledata/.nexus-cron-heartbeat && test $$(( $$(date +%s) - $$(stat -c %Y /var/www/moodledata/.nexus-cron-heartbeat) )) -lt 180"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 120s
    networks:
      - nexus

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
      PMA_ARBITRARY: "0"
      UPLOAD_LIMIT: 512M
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1/\") === false ? 1 : 0);'"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - nexus

volumes:
  moodle_app:
    name: nexus-eps-lms_moodle_app
  moodledata:
    name: nexus-eps-lms_moodledata
  mariadb_data:
    name: nexus-eps-lms_mariadb_data
  redis_data:
    name: nexus-eps-lms_redis_data

networks:
  nexus:
    name: nexus-eps-lms_network
    driver: bridge
